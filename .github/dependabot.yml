version: 2
updates:
  # Python dependencies: runtime, extras and dev tooling.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
    groups:
      # Linters and type checkers move fast; review them as one PR.
      lint-and-types:
        patterns:
          - "ruff"
          - "mypy"
          - "types-*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
      # Runtime dependencies are reviewed individually: a SQLAlchemy or pydantic
      # minor can change behaviour that Masker depends on.

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - ci
