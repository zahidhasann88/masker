name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff check
        run: ruff check src tests scripts examples

      - name: Ruff format (check only)
        run: ruff format --check src tests scripts examples

      - name: Mypy (strict, src/)
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Pytest with coverage
        run: python -m pytest --cov=masker --cov-report=xml --cov-report=term

      - name: SQLite demo
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        run: python examples/demo.py

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  databases:
    name: Integration (${{ matrix.db.name }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        db:
          - name: postgresql
            env: MASKER_TEST_POSTGRES_URL
            marker: postgres
            url: postgresql+psycopg://postgres:postgres@localhost:5432/masker_test
          - name: mysql
            env: MASKER_TEST_MYSQL_URL
            marker: mysql
            url: mysql+pymysql://root:root@127.0.0.1:3306/masker_test
    services:
      postgres:
        image: ${{ matrix.db.name == 'postgresql' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.db.name == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: masker_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with the driver for ${{ matrix.db.name }}
        run: |
          if [ "${{ matrix.db.name }}" = "postgresql" ]; then
            python -m pip install -e '.[dev,postgres]'
          else
            python -m pip install -e '.[dev,mysql]'
          fi

      - name: Wait for ${{ matrix.db.name }}
        run: |
          for i in $(seq 1 30); do
            python - <<'PY' && exit 0
          import sys
          from sqlalchemy import create_engine, text
          try:
              create_engine("${{ matrix.db.url }}").connect().execute(text("SELECT 1"))
          except Exception as exc:
              print(f"not ready: {exc}")
              sys.exit(1)
          PY
            sleep 2
          done
          echo "${{ matrix.db.name }} never became ready"
          exit 1

      - name: Run the ${{ matrix.db.name }} integration tests
        env:
          ${{ matrix.db.env }}: ${{ matrix.db.url }}
        run: python -m pytest -m "${{ matrix.db.marker }}" -v --no-cov

  performance:
    name: Performance smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Mask 100k rows per table
        run: |
          python scripts/bench_sqlite.py --rows 100000
          MASKER_RUN_PERF=1 python -m pytest -m perf -q --no-cov

  package:
    name: Build & install from the wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Install into a clean venv and check the entry point
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install --quiet dist/*.whl
          /tmp/verify-venv/bin/masker --version
          /tmp/verify-venv/bin/masker --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
