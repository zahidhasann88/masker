name: Feature request
description: Suggest a transformer, a command or a behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the situation, not the implementation. "I have 40M rows and
        `fake` takes 90 minutes" is more useful than "add multiprocessing".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Masker to do?
      description: A sketch of the rules file or command line you wish existed.
      render: yaml
      placeholder: |
        columns:
          ssn: {transformer: format_preserving_encrypt, params: {tweak: ...}}
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including what you do today to work around it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - New transformer
        - CLI / commands
        - Rules file
        - scan / verify (detection)
        - Performance
        - New database backend
        - Documentation
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: |
            This is not about re-identification guarantees. Masker reduces
            disclosure risk; it does not claim legal anonymity (see the
            README's Limitations section).
          required: true
