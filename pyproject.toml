[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "masker-db"
version = "0.1.0"
description = "Deterministic, schema-aware database anonymization for sharing production data safely."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zahid Hasan", email = "jahidhasann67@gmail.com" }]
keywords = [
  "anonymization",
  "masking",
  "database",
  "privacy",
  "pii",
  "test-data",
  "sqlalchemy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "Faker>=25.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0.30,<3",
  "pydantic>=2.7,<3",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
masker = "masker.cli:main"

[project.urls]
Homepage = "https://github.com/zahidhasann88/masker"
Repository = "https://github.com/zahidhasann88/masker"
Issues = "https://github.com/zahidhasann88/masker/issues"
Changelog = "https://github.com/zahidhasann88/masker/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/masker"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/SECURITY.md",
]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "RUF012", # mutable class attrs: SQLAlchemy/pydantic patterns
  "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented style is `typer.Option(...)` as an argument default.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["masker"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["faker.*", "pymysql.*", "psycopg.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "postgres: integration tests that need MASKER_TEST_POSTGRES_URL",
  "mysql: integration tests that need MASKER_TEST_MYSQL_URL",
  "perf: performance sanity checks (opt-in with --run-perf)",
]

[tool.coverage.run]
branch = true
source = ["src/masker"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
